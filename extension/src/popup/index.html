<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual AI Agent</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    body {
      width: 340px;
      padding: 16px;
      background-color: var(--color-cream);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
    }
    .feed-container {
      max-height: 180px;
      overflow-y: auto;
    }
    .feed-item {
      background: var(--color-latte);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--color-border);
      font-size: 12px;
    }
    .feed-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      color: var(--color-mocha);
      margin-bottom: 4px;
    }
    .feed-item-summary {
      color: var(--color-espresso);
      line-height: 1.3;
    }
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Visual AI Agent</h1>
    <div id="status-badge" class="status-badge">
      <span class="status-dot"></span> Active
    </div>
  </div>

  <div class="card" style="padding: 10px; margin-bottom: 12px;">
    <div class="card-title" style="margin-bottom: 4px;">Recent AI Summaries</div>
    <div id="ai-feed" class="feed-container">
      <p style="font-size: 12px; color: var(--color-mocha); margin: 6px 0;">Loading activity summaries...</p>
    </div>
  </div>

  <div class="actions-grid">
    <button id="capture-now-btn" class="btn-pill">Capture Page Now</button>
    <button id="block-site-btn" class="btn-pill btn-secondary">Block This Site</button>
    <button id="toggle-btn" class="btn-pill btn-secondary">Pause Tracking</button>
  </div>

  <div class="footer-links">
    <a href="#" id="open-consent-link">Consent Notice</a>
    <a href="#" id="open-options-link">Settings & Data Rights →</a>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
