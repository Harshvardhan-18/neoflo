services:
  postgres:
    image: postgres:16-alpine
    container_name: visual_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: visual_ai_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_ai_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: visual_ai_postgres_data
